# REUSE specification (https://reuse.software). One license per path.
version = 1
SPDX-PackageName = "cigar-script"
SPDX-PackageSupplier = "Jay Taylor"
SPDX-PackageDownloadLocation = "https://github.com/otmof-ops/cigar-script"

[[annotations]]
path = ["src/**", "tests/**", "bench/**", "build.rs", "Cargo.toml", "Cargo.lock", ".github/**", ".gitignore", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jay Taylor (https://github.com/otmof-ops/cigar-script)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["docs/**", "README.md", "CONTRIBUTING.md", "SECURITY.md", "TRADEMARKS.md", "THIRD-PARTY-NOTICES.md", "NOTICE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jay Taylor (https://github.com/otmof-ops/cigar-script)"
SPDX-License-Identifier = "CC-BY-4.0"
