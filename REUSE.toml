SPDX-FileCopyrightText = "2026 Jay Taylor (https://github.com/otmof-ops/cigar-script)"
SPDX-License-Identifier = "FSL-1.1-ALv2"

[[annotations]]
path = ["docs/**", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSING.md", "SECURITY.md", "TRADEMARKS.md", "THIRD-PARTY-NOTICES.md", "NOTICE"]
