name: release

# A tag `vX.Y.Z` builds cigar and its language server, cigar-lsp, for every
# machine the family is released for and leaves a DRAFT release holding each
# build, its .sha256, SHA256SUMS and a build attestation. Nothing is published from here: the release is read and
# published by hand once the licence gate has passed. A tag is the only
# trigger; a pull request or a push to a branch builds nothing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each build is one archive, cigar-vX.Y.Z-<os>-<arch>.tar.gz, holding
        # bin/cigar and bin/cigar-lsp (.exe on Windows), with a .sha256 beside it.
        # The installer's manifest reads it as an archive (strip 0) with a shim
        # for each program, so an editor finds cigar-lsp on PATH.
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  asset: linux-x86_64,   ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: linux-aarch64,  ext: "" }
          - { os: macos-15-intel, target: x86_64-apple-darwin,       asset: macos-x86_64,   ext: "" }
          - { os: macos-latest,   target: aarch64-apple-darwin,      asset: macos-aarch64,  ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    asset: windows-x86_64, ext: ".exe" }
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools (linux builds are static)
        if: runner.os == 'Linux'
        run: |
          # Canonical's names can stop resolving for hours (2026-11-11: the runner's mirror list and
          # archive.ubuntu.com alike, while public resolvers still answered). Each try is time-bound; after
          # a failed one apt goes to the main archive, and a name this runner cannot resolve is pinned in
          # /etc/hosts from DNS over HTTPS to 1.1.1.1, which needs no lookup. apt still checks signatures.
          for i in 1 2 3 4; do
            if timeout 300 sudo apt-get -o Acquire::Retries=3 update \
              && timeout 300 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends musl-tools; then
              break
            fi
            if [ "$i" -eq 4 ]; then exit 1; fi
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              if [ -f "$f" ] && grep -q 'mirror+file:' "$f"; then
                sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' "$f"
                echo "apt: $f now uses archive.ubuntu.com"
              fi
            done
            for h in archive.ubuntu.com security.ubuntu.com; do
              if ! getent hosts "$h" >/dev/null; then
                ip=$(curl -fsS --max-time 10 -H 'accept: application/dns-json' "https://1.1.1.1/dns-query?name=$h&type=A" \
                  | jq -r '[.Answer[]? | select(.type == 1) | .data][0] // empty' || true)
                if [ -n "$ip" ]; then
                  echo "$ip $h" | sudo tee -a /etc/hosts >/dev/null
                  echo "apt: $h pinned to $ip"
                fi
              fi
            done
            sleep $((i * 15))
          done
      - name: the tag matches Cargo.toml
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$want" != "$have" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $have"
            exit 1
          fi
      - run: cargo build --release --locked --bin cigar --bin cigar-lsp --target ${{ matrix.target }}
      - name: they run
        shell: bash
        run: |
          dir="target/${{ matrix.target }}/release"
          "$dir/cigar${{ matrix.ext }}" --version
          # The language server speaks on stdin and ends when it closes; any
          # exit code but "could not run" will do here.
          code=0
          "$dir/cigar-lsp${{ matrix.ext }}" < /dev/null || code=$?
          echo "cigar-lsp ended on an empty stdin with $code"
          case "$code" in 126|127) exit 1 ;; esac
      - name: pack and checksum the asset
        shell: bash
        run: |
          name="cigar-${GITHUB_REF_NAME}-${{ matrix.asset }}.tar.gz"
          dir="target/${{ matrix.target }}/release"
          mkdir -p dist stage/bin
          cp "$dir/cigar${{ matrix.ext }}" "$dir/cigar-lsp${{ matrix.ext }}" stage/bin/
          tar -czf "dist/$name" -C stage bin
          tar -tzf "dist/$name"
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "$name" > "$name.sha256")
          else
            (cd dist && shasum -a 256 "$name" > "$name.sha256")
          fi
          cat "dist/$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cigar-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  draft:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cigar-*
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
      - name: the licence files, once
        run: cp src/LICENSE src/NOTICE src/THIRD-PARTY-NOTICES.md dist/
      - name: SHA256SUMS
        run: |
          cd dist
          cat cigar-*.sha256 | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - name: attest the builds
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/cigar-v*.tar.gz
      - name: the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "cigar ${GITHUB_REF_NAME#v}" \
            --notes "Draft: read, run the licence gate, then publish by hand."
