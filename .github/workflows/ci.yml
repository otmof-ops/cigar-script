name: ci

on:
  push:
    branches: [main]
  pull_request:

# The repo is private and on the free plan, so this is one lean Linux
# job: no macOS, no Windows, no matrix, no schedule.
jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CIGSCRIPT_SRC: ${{ github.workspace }}/../CigScript
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out CigScript (for the superset tests)
        run: |
          git clone --depth 1 --branch v1.20.0 https://github.com/otmof-ops/cig-script ../CigScript

      - name: Install Rust (stable)
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets
