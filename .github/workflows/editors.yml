name: editors

# The editor packages (#16): the tree-sitter grammar, the VS Code extension,
# and `cigar fmt --check` on this repository's own files. Lean on purpose
# (free plan): Linux only, no schedule, and only when these paths change.
on:
  push:
    branches: [main]
    paths:
      - "editors/**"
      - "src/fmt.rs"
      - "src/lsp/**"
      - "bench/**"
      - ".github/workflows/editors.yml"
  pull_request:
    paths:
      - "editors/**"
      - "src/fmt.rs"
      - "src/lsp/**"
      - "bench/**"
      - ".github/workflows/editors.yml"

permissions:
  contents: read

jobs:
  fmt-check:
    name: cigar fmt --check
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-editors-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-editors-cargo-

      - name: Build cigar
        run: cargo build --locked --bin cigar

      # This repository's own .cigar and .cig files: everything but the test
      # fixtures (which are unformatted on purpose: their errors name columns)
      # and the editor packages' own folders.
      - name: cigar fmt --check
        run: |
          export HOME="$RUNNER_TEMP/home" CIGSCRIPT_HOME="$RUNNER_TEMP/cig"
          mkdir -p "$HOME"
          find . -type f \( -name '*.cigar' -o -name '*.cig' \) \
            -not -path './tests/*' -not -path './target/*' -not -path './editors/*/node_modules/*' \
            -print0 | sort -z | xargs -0 --no-run-if-empty ./target/debug/cigar fmt --check

  grammar:
    name: tree-sitter grammar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/tree-sitter-cigarscript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/tree-sitter-cigarscript/package-lock.json
      - name: Install tree-sitter-cli (pinned by package-lock.json)
        run: npm ci
      - name: tree-sitter generate
        run: npx tree-sitter generate
      - name: tree-sitter test
        run: npx tree-sitter test

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run compile
      - name: vsce package
        run: npm run package
      - name: The package carries the client and its one dependency
        run: |
          unzip -l ./*.vsix > vsix.txt
          grep -q 'extension/out/extension.js' vsix.txt
          grep -q 'extension/node_modules/vscode-languageclient/' vsix.txt
          ! grep -q 'extension/node_modules/typescript/' vsix.txt
