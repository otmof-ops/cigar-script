#
# The nightly benchmark run (#17): the whole of bench/bench.toml on cig-script's
# reusable workflow, results appended to the `bench-history` branch, which
# `cig bench history` reads. Pull requests do not run it: the heavy suites are
# nightly (DECISIONS 11), and ci.yml already runs the fast checks. Timings are
# reported, never gated; a case whose output is WRONG fails the run.
name: bench-nightly

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

jobs:
  bench:
    uses: otmof-ops/cig-script/.github/workflows/bench.yml@main
    with:
      mode: nightly
      # The cig the suite is measured with, sha256 checked: the one cigar is built on.
      cig-version: "1.21.0"
      # What the suite needs beside cig: the CigScript checkout (../CigScript,
      # the compute set and the examples) and this repository's `cigar`.
      prepare: |
        set -eu
        git clone --depth 1 --branch v1.21.0 https://github.com/otmof-ops/cig-script ../CigScript
        cargo build --release --locked --bin cigar
        echo "$PWD/target/release" >> "$GITHUB_PATH"
    permissions:
      contents: write       # the nightly appends to the bench-history branch
      pull-requests: write
