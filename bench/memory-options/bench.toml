# The Rust variants of the memory options (docs/decisions/0002-memory.md, #3),
# in the shape cig-script's docs/BENCH.md defines. Build first:
#
#     cargo build --release --manifest-path bench/memory-options/Cargo.toml
#
# then, from this folder:  cig bench --manifest bench/memory-options/bench.toml
# (the paths below are from the manifest's folder). Every case's output is
# checked against the .expect file of the CigarScript program it ports. The
# "x100" cases repeat the workload a hundred times in one process so a Rust
# run is long enough to time (run those with --samples 5 --per 1); the peak
# memory of a repeat is the single run's.

[bench]
product = "memory-options"
home    = "isolated"

[defaults]
samples = 9
per     = 5
warmup  = 1
env     = { NO_COLOR = "1" }

[[case]]
name  = "trees / own"
group = "trees"
run   = ["target/release/memory-options", "trees", "own"]
expect = { exit = 0, stdout = "../fixtures/memory/trees.expect" }

[[case]]
name  = "trees / rc"
group = "trees"
run   = ["target/release/memory-options", "trees", "rc"]
expect = { exit = 0, stdout = "../fixtures/memory/trees.expect" }

[[case]]
name  = "trees / gc"
group = "trees"
run   = ["target/release/memory-options", "trees", "gc"]
expect = { exit = 0, stdout = "../fixtures/memory/trees.expect" }

[[case]]
name  = "trees / own x100"
group = "trees-x100"
run   = ["target/release/memory-options", "trees", "own", "100"]
expect = { exit = 0, stdout = "../fixtures/memory/trees.expect" }

[[case]]
