# ----- the superset: cig's compute set, as it is (#1) ---------------------------
# Each program twice, from the same bytes: `cig run x.cig` and `cigar run
# x.cigar` (mild), through `fixtures/same.sh`, which holds the output of both to
# cig's own .expect file: a program that prints something else exits 1, and the
# case is WRONG, so "the same output" is enforced here too. `cigar run`
# builds its program in an isolated home each sample, which `cig run` does not:
# the gap is what the superset costs on a cold home, not the interpreter's speed.

[[case]]
name  = "cig run: closures"
group = "superset"
setup = ["sh", "fixtures/superset.sh", "generated/superset"]
run   = ["sh", "fixtures/same.sh", "cig", "generated/superset/closures.cig"]
per   = 1
expect = { exit = 0 }

[[case]]
name  = "cigar run: closures"
group = "superset"
setup = ["sh", "fixtures/superset.sh", "generated/superset"]
run   = ["sh", "fixtures/same.sh", "cigar", "generated/superset/closures.cigar"]
