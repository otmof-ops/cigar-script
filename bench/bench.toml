# The benchmark manifest for cigar-script (#17), in the shape cig-script's
# docs/BENCH.md defines. Run it from the repository root:
#
#     cig bench bench/bench.toml                    every case (the nightly)
#     cig bench bench/bench.toml --group check-1k   one group
#     cig bench bench/bench.toml --timings          where `cigar check` spends it
#
# What is measured, by group:
#
#   check-100, check-1k, check-10k, check-100k
#                  `cigar check` of the same program at mild, medium and full
#                  (#7), at 100, 1,000, 10,000 and 100,000 lines
#   inference      generics-heavy code at medium and full (#10)
#   exhaustiveness `match` over five-variant enums, every one covered (#9)
#   superset       cig's shared compute set, as it is, run as `cig run` and as
#                  mild `cigar run` (#1). Reported, never gated: the +2% the
#                  issue asks for is read from the two columns (DECISIONS 1)
#   check-corpus   the CigScript examples through `cigar check` and `cig check`
#   memory-*       today's runtime on the three programs of docs/decisions/0002
#
# The generated programs come from `fixtures/generate.py` (no clock, no random
# numbers; `fixtures/SHA256SUMS` holds every file's sha256) into `generated/`,
# which is not committed. The superset group copies cig's `bench/compute` from
# $CIGSCRIPT_SRC (below) with `fixtures/superset.sh`.
#
# Waiting: these groups of the issue cannot be measured yet. Each is added in
# the change that makes it possible, not before.
#
#   types for speed   waits on cig-compile#34 (stage D) and on typed programs
#                     the compiler can build; the programs and the checker are
#                     here, the compiled side is not
#   memory, automatic against ownership at full
#                     waits on cigar-script#12 (ownership at full is checked,
#                     not run differently yet); `trees`, `nbody` and the 100 MB
#                     buffer program need a second runtime to be a comparison.
#                     The runtime-today half is below
#   interop           waits on cigar-script#5 (calling Rust and C)
#   tooling           waits on cigar-script#16 (the language server: start,
#                     completion, a diagnostic after an edit; budgets 300 ms
#                     and 50 ms)
#   context reads     waits on cigar-script#14 (`stats.total` across files)
#   `--stats`, allocations
#                     reads CIG_STATS_FD; cigar writes timings only (#17),
#                     counters come when the runtime behind `cigar run` reports
#                     them

format = 1

[bench]
product = "cigar"
version = ["cigar", "--version"]
home    = "isolated"
build   = ["cargo", "build", "--release", "--locked", "--bin", "cigar"]
binary  = "target/release/cigar"
watch   = ["src/**", "Cargo.toml", "bench/**"]

[defaults]
samples = 9
per     = 5
warmup  = 1
# The harness starts every case from an empty environment, so the CigScript
# checkout is named here. It is relative to this folder: the sibling checkout
# `../../CigScript`, which is where the repository's CI puts it.
env     = { NO_COLOR = "1", CIG_DOCTOR = "0", CIGSCRIPT_SRC = "../../CigScript" }

