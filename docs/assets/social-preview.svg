<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="CigarScript: CigScript grown deeper, mild, medium and full, chosen per file. A CigScript language.">
  <title>CigarScript</title>
  <defs>
    <!-- the family ember -->
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="45%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.9"/>
    </radialGradient>
    <!-- tobacco-leaf wrapper, lit from above -->
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0703d"/>
      <stop offset="50%" stop-color="#85582c"/>
      <stop offset="100%" stop-color="#5e3d1e"/>
    </linearGradient>
  </defs>
  <style>
    .word { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 66px; font-weight: 700; letter-spacing: -2px; }
    .tag { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 31px; fill: #d1d5db; }
    .sub { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 24px; fill: #9ca3af; }
    .chip { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 20px; fill: #9ca3af; }
  </style>
  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="8" fill="#f97316"/>
  <!-- the cigar mark, scaled up from the logo -->
  <g transform="translate(60 118) scale(1.7)">
    <!-- the cigar body: thicker than a cigarette, same rounded-rect language -->
    <rect x="24" y="86" width="190" height="32" rx="9" fill="url(#leaf)" stroke="#6b4423" stroke-width="1.5"/>
    <!-- faint leaf veins -->
    <g fill="none" stroke="#c89560" stroke-width="1.1" stroke-linecap="round" opacity="0.45">
      <path d="M 84 92 C 100 98, 112 96, 130 102"/>
      <path d="M 120 110 C 138 106, 152 108, 170 100"/>
      <path d="M 150 91 C 164 95, 176 94, 196 98"/>
      <path d="M 74 112 C 90 108, 98 110, 108 108"/>
    </g>
    <!-- the head: a slightly lighter cut cap -->
    <rect x="24" y="86" width="12" height="32" rx="6" fill="#c8a25f" opacity="0.55"/>
    <!-- the band: family orange, edged in filter tan -->
    <rect x="48" y="86" width="22" height="32" fill="#f97316"/>
    <rect x="48" y="86" width="22" height="32" fill="none" stroke="#d6b370" stroke-width="2.2"/>
    <!-- the lit foot: ring of grey ash, then the ember -->
    <rect x="206" y="88" width="20" height="28" rx="7" fill="#d1d5db"/>
    <rect x="206" y="88" width="20" height="28" rx="7" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
    <g stroke="#9ca3af" stroke-width="1" opacity="0.7"><path d="M 212 92 L 212 112"/><path d="M 219 91 L 219 113"/></g>
    <circle cx="228" cy="102" r="20" fill="#f97316" opacity="0.14"/>
    <circle cx="228" cy="102" r="13" fill="url(#ember)"/>
    <!-- three wisps of smoke -->
    <g fill="none" stroke="#9ca3af" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
      <path d="M 228 80 C 218 70, 240 62, 228 52"/>
      <path d="M 237 78 C 249 68, 227 62, 239 48"/>
      <path d="M 220 82 C 210 74, 222 66, 216 56"/>
    </g>
  </g>
  <text x="530" y="232" class="word" fill="#9ca3af">Cigar<tspan fill="#f97316">Script</tspan></text>
  <text x="534" y="284" class="sub">a CigScript language</text>
  <text x="120" y="440" class="tag">CigScript grown deeper: mild, medium and full, chosen per file</text>
  <!-- the three strengths -->
  <rect x="120" y="498" width="86" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="163.0" y="523" text-anchor="middle" class="chip">mild</text>
  <rect x="218" y="498" width="116" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="276.0" y="523" text-anchor="middle" class="chip">medium</text>
  <rect x="346" y="498" width="76" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="384.0" y="523" text-anchor="middle" class="chip">full</text>
  <text x="120" y="590" class="sub">mild is built; medium and full are designed, not built yet</text>
</svg>
