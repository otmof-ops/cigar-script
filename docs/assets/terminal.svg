<svg xmlns="http://www.w3.org/2000/svg" width="960" height="835" viewBox="0 0 960 835" role="img" aria-label="A terminal: cat shows a medium CigarScript file with a record, a typed function and a burn that moves two files; cigar check prints checked; cigar run --dry-run prints the moves and a plan of three reversible operations and says nothing was changed; after one field is changed to the number 3, cigar check gives E1201, expected Path, found Int, with the line and the field&#x27;s type as the reason.">
  <title>cigar check and cigar run, for real</title>
  <rect x="1" y="1" width="958" height="833" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <path d="M 1 34 L 959 34" stroke="#30363d" stroke-width="1"/>
  <circle cx="22" cy="17" r="5.5" fill="#f97316"/>
  <circle cx="40" cy="17" r="5.5" fill="#9ca3af" opacity="0.6"/>
  <circle cx="58" cy="17" r="5.5" fill="#9ca3af" opacity="0.6"/>
  <text x="480.0" y="21" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#9ca3af">~/demo</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#d1d5db">
    <text x="22" y="56.0" xml:space="preserve"><tspan fill="#9ca3af">$ </tspan><tspan fill="#f3f4f6" font-weight="700">cat moves.cigar</tspan></text>
    <text x="22" y="73.5" xml:space="preserve"><tspan fill="#d1d5db">strength medium</tspan></text>
    <text x="22" y="108.5" xml:space="preserve"><tspan fill="#d1d5db">record Move { from: Path, to: Path }</tspan></text>
    <text x="22" y="143.5" xml:space="preserve"><tspan fill="#d1d5db">pull plan(names: List&lt;Text&gt;) -&gt; List&lt;Move&gt; {</tspan></text>
    <text x="22" y="161.0" xml:space="preserve"><tspan fill="#d1d5db">  roll out: List&lt;Move&gt; = []</tspan></text>
    <text x="22" y="178.5" xml:space="preserve"><tspan fill="#d1d5db">  for n in names {</tspan></text>
    <text x="22" y="196.0" xml:space="preserve"><tspan fill="#d1d5db">    out.push(Move { from: n, to: "docs/${n}" })</tspan></text>
    <text x="22" y="213.5" xml:space="preserve"><tspan fill="#d1d5db">  }</tspan></text>
    <text x="22" y="231.0" xml:space="preserve"><tspan fill="#d1d5db">  snuff out</tspan></text>
    <text x="22" y="248.5" xml:space="preserve"><tspan fill="#d1d5db">}</tspan></text>
    <text x="22" y="283.5" xml:space="preserve"><tspan fill="#d1d5db">stick moves = plan(["a.txt", "b.txt"])</tspan></text>
    <text x="22" y="301.0" xml:space="preserve"><tspan fill="#d1d5db">burn {</tspan></text>
    <text x="22" y="318.5" xml:space="preserve"><tspan fill="#d1d5db">  for m in moves {</tspan></text>
    <text x="22" y="336.0" xml:space="preserve"><tspan fill="#d1d5db">    fs.mkdir(path.dir(m.to))</tspan></text>
    <text x="22" y="353.5" xml:space="preserve"><tspan fill="#d1d5db">    fs.mv(m.from, m.to)</tspan></text>
    <text x="22" y="371.0" xml:space="preserve"><tspan fill="#d1d5db">  }</tspan></text>
    <text x="22" y="388.5" xml:space="preserve"><tspan fill="#d1d5db">}</tspan></text>
    <text x="22" y="406.0" xml:space="preserve"><tspan fill="#d1d5db">exhale moves</tspan></text>
    <text x="22" y="441.0" xml:space="preserve"><tspan fill="#9ca3af">$ </tspan><tspan fill="#f3f4f6" font-weight="700">cigar check moves.cigar</tspan></text>
    <text x="22" y="458.5" xml:space="preserve"><tspan fill="#4ade80" font-weight="700">checked</tspan><tspan fill="#d1d5db"> moves.cigar</tspan></text>
    <text x="22" y="493.5" xml:space="preserve"><tspan fill="#9ca3af">$ </tspan><tspan fill="#f3f4f6" font-weight="700">cigar run --dry-run moves.cigar</tspan></text>
    <text x="22" y="511.0" xml:space="preserve"><tspan fill="#d1d5db">[Move { from: "a.txt", to: "docs/a.txt" }, Move { from: "b.txt", to: "docs/b.txt" }]</tspan></text>
    <text x="22" y="528.5" xml:space="preserve"><tspan fill="#d1d5db">dry-run plan: 3 ops</tspan></text>
    <text x="22" y="546.0" xml:space="preserve"><tspan fill="#d1d5db">     1  reversible    mkdir docs</tspan></text>
    <text x="22" y="563.5" xml:space="preserve"><tspan fill="#d1d5db">     2  reversible    move a.txt -&gt; docs/a.txt</tspan></text>
    <text x="22" y="581.0" xml:space="preserve"><tspan fill="#d1d5db">     3  reversible    move b.txt -&gt; docs/b.txt</tspan></text>
    <text x="22" y="598.5" xml:space="preserve"><tspan fill="#9ca3af">nothing was changed</tspan></text>
    <text x="22" y="633.5" xml:space="preserve"><tspan fill="#9ca3af">$ </tspan><tspan fill="#f3f4f6" font-weight="700">sed -i 's/from: n/from: 3/' moves.cigar</tspan></text>
    <text x="22" y="668.5" xml:space="preserve"><tspan fill="#9ca3af">$ </tspan><tspan fill="#f3f4f6" font-weight="700">cigar check moves.cigar</tspan></text>
    <text x="22" y="686.0" xml:space="preserve"><tspan fill="#9ca3af">Don't see any cigarettes.</tspan></text>
    <text x="22" y="703.5" xml:space="preserve"><tspan fill="#f87171" font-weight="700">error[E1201 check]</tspan><tspan fill="#d1d5db">: expected `Path`, found `Int`</tspan></text>
    <text x="22" y="721.0" xml:space="preserve"><tspan fill="#9ca3af">  --&gt; </tspan><tspan fill="#d1d5db">moves.cigar:8:27</tspan></text>
    <text x="22" y="738.5" xml:space="preserve"><tspan fill="#9ca3af">  |</tspan></text>
    <text x="22" y="756.0" xml:space="preserve"><tspan fill="#9ca3af">8 | </tspan><tspan fill="#d1d5db">    out.push(Move { from: 3, to: "docs/${n}" })</tspan></text>
    <text x="22" y="773.5" xml:space="preserve"><tspan fill="#9ca3af">  | </tspan><tspan fill="#f87171" font-weight="700">                          ^</tspan></text>
    <text x="22" y="791.0" xml:space="preserve"><tspan fill="#9ca3af">  = hint: </tspan><tspan fill="#d1d5db">expected `Path` here, because of the type of field `from` in `Move`</tspan></text>
    <text x="22" y="808.5" xml:space="preserve"><tspan fill="#9ca3af">  = explain: cig explain E1201</tspan></text>
  </g>
</svg>
